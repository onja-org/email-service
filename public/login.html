<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Pigeon</title>
<meta name="theme-color" content="#f3ede0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/ui.css">
</head>
<body class="login-page">
<div class="airmail-bar" aria-hidden="true"></div>
<main style="width:100%">
  <section class="card login">
    <a class="brand" href="/" aria-label="Pigeon home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M6 41l12-6c6-4 11-7 17-12 0-7 5-12 11-12 4 0 7 3 7 6l6 2-6 2c-1 2-2 4-1 7 3 6 1 13-7 17-8 4-19 4-27 1z"/><path fill="var(--neck)" d="M35 23c3 4 9 6 16 4-1-3-1-5 1-8-6 2-12 3-17 4z"/><circle cx="48" cy="15.5" r="1.9" fill="var(--page)"/><path d="M34 50l-1 7m10-8l1 8m-14 0h6m8 0h6" stroke="#c8361d" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span class="brand-name">Pigeon</span>
    </a>
    <h1>Sign in to admin</h1>
    <p class="sub" style="margin:0">Manage projects, sending domains, API keys and the suppression list.</p>
    <div class="banner" id="banner" role="alert" hidden style="margin:14px 0 0"></div>
    <form id="form" autocomplete="on">
      <label class="field">Admin token
        <input type="password" id="token" autocomplete="current-password" required autofocus>
        <span class="hint">The service's <code>ADMIN_TOKEN</code>. It is exchanged for a 12-hour session and not kept in the browser.</span>
      </label>
      <button class="primary" type="submit" id="submit">Sign in</button>
    </form>
    <div class="foot">Building an app that sends email? You need an API key from an admin, not this page. <a href="/docs">Developer guide →</a></div>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  // Only ever return to a same-origin path, never an absolute URL.
  const target = next && /^\/[^/\\]/.test(next) ? next : '/admin/ui';
  const show = (msg, ok) => { const b = $('#banner'); b.textContent = msg; b.className = `banner${ok ? ' ok' : ''}`; b.hidden = false; };
  if (params.get('reason') === 'expired') show('Your session has expired. Sign in again to continue where you left off.', true);

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#submit');
    btn.disabled = true; btn.classList.add('busy'); $('#banner').hidden = true;
    try {
      const res = await fetch('/admin/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-requested-with': 'emailsvc-ui' },
        body: JSON.stringify({ token: $('#token').value.trim() }),
      });
      if (res.ok) { location.replace(target); return; }
      const body = await res.json().catch(() => ({}));
      show(body?.error?.message || `Sign-in failed (HTTP ${res.status})`);
      $('#token').value = ''; $('#token').focus();
    } catch (err) {
      show(`Network error: ${err.message}`);
    } finally {
      btn.disabled = false; btn.classList.remove('busy');
    }
  });
})();
</script>
</body>
</html>
