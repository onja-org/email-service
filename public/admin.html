<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeon admin</title>
<meta name="theme-color" content="#f3ede0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header class="appbar">
  <div class="airmail-bar" aria-hidden="true"></div>
  <div class="appbar-inner">
    <a class="brand" href="#/projects" aria-label="Pigeon admin home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M6 41l12-6c6-4 11-7 17-12 0-7 5-12 11-12 4 0 7 3 7 6l6 2-6 2c-1 2-2 4-1 7 3 6 1 13-7 17-8 4-19 4-27 1z"/><path fill="var(--neck)" d="M35 23c3 4 9 6 16 4-1-3-1-5 1-8-6 2-12 3-17 4z"/><circle cx="48" cy="15.5" r="1.9" fill="var(--page)"/><path d="M34 50l-1 7m10-8l1 8m-14 0h6m8 0h6" stroke="#c8361d" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      <span class="brand-name">Pigeon</span><span class="brand-tag">Admin</span>
    </a>
    <nav id="nav" aria-label="Admin">
      <a href="#/projects" data-route="projects">Projects</a>
      <a href="#/emails" data-route="emails">Email log</a>
      <a href="#/suppressions" data-route="suppressions">Suppressions</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/docs">Docs</a>
    </nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="small ghost" id="signout">Sign out</button>
  </div>
</header>
<main>
  <div id="view"></div>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const UI_HEADERS = { 'x-requested-with': 'emailsvc-ui' };
  const enc = encodeURIComponent;

  // ---- DOM helpers: textContent only, every string here comes from the API or the user ----
  const el = (tag, attrs = {}, children = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'html') throw new Error('no innerHTML');
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of [].concat(children)) if (c != null) n.append(c);
    return n;
  };
  const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
  const fmt = (iso) => iso ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '–';
  const ago = (iso) => { if (!iso) return 'never'; const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`; };
  const plural = (n, word) => `${n.toLocaleString()} ${word}${n === 1 ? '' : 's'}`;
  const STATUS_CLASS = { sent: 'good', delivered: 'good', queued: '', sending: '', suppressed: 'warn', failed: 'bad', bounced: 'bad', complained: 'bad' };
  const chip = (text, cls) => el('span', { class: `chip ${cls || ''}`, text });
  const statusChip = (s) => chip(s, `dot ${STATUS_CLASS[s] ?? ''}`);
  const loadingCard = (text = 'Loading…') => el('div', { class: 'card loading-card', text });
  const field = (label, input, hint) => el('label', { class: 'field' }, [label, input, hint ? el('span', { class: 'hint', text: hint }) : null]);

  // ---- API ----
  class ApiError extends Error { constructor(status, body) { super(body?.error?.message || `HTTP ${status}`); this.status = status; this.code = body?.error?.code; this.details = body?.error?.details; } }
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { ...UI_HEADERS, ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) { location.replace(`/admin/login?reason=expired&next=${enc('/admin/ui' + location.hash)}`); throw new ApiError(401, null); }
    if (res.status === 204) return null;
    const json = await res.json().catch(() => null);
    if (!res.ok) throw new ApiError(res.status, json);
    return json;
  }
  const get = (p) => api('GET', p);

  // ---- feedback: toasts in a corner, so they are seen wherever the action was on the page ----
  /** banner(msg, ok): success fades after a few seconds, errors stay until dismissed. banner(null) clears all. */
  function banner(msg, ok = false) {
    const host = $('#toasts');
    if (!msg) { clear(host); return; }
    const t = el('div', { class: `toast${ok ? '' : ' error'}`, role: ok ? 'status' : 'alert' }, [
      el('div', { class: 'msg', text: msg }),
      el('button', { class: 'small ghost', type: 'button', 'aria-label': 'Dismiss', text: '✕', onclick: () => t.remove() }),
    ]);
    if (!ok) host.querySelectorAll('.toast.error').forEach((x) => x.remove()); // one error at a time
    host.append(t);
    if (ok) setTimeout(() => t.remove(), 5000);
  }
  function describe(err) {
    if (err instanceof ApiError && Array.isArray(err.details) && err.details.length) {
      return `${err.message}: ${err.details.map((d) => `${(d.instancePath || d.path || '').toString().replace(/^\//, '')} ${d.message}`.trim()).join('; ')}`;
    }
    return err.message || String(err);
  }
  /** Runs an action from a form/button, showing a spinner on it meanwhile and reporting errors. */
  async function act(btn, fn, okMsg) {
    btn.disabled = true; btn.classList.add('busy'); banner(null);
    try { await fn(); if (okMsg) banner(okMsg, true); } catch (err) { banner(describe(err)); } finally { btn.disabled = false; btn.classList.remove('busy'); }
  }
  /** Two-step inline confirmation (no window.confirm). Returns a button that turns into "Confirm / Cancel". */
  function confirmButton(label, onConfirm, cls = 'danger', confirmLabel = 'Confirm', okMsg) {
    const wrap = el('span', { class: 'actions' });
    const main = el('button', { class: `small ${cls}`, text: label, onclick: () => {
      clear(wrap);
      const yes = el('button', { class: `small ${cls} solid`, text: confirmLabel, onclick: (e) => act(e.currentTarget, onConfirm, okMsg) });
      wrap.append(yes, el('button', { class: 'small', text: 'Cancel', onclick: () => { clear(wrap); wrap.append(main); main.focus(); } }));
      yes.focus();
    } });
    wrap.append(main);
    return wrap;
  }
  const copyButton = (text, label = 'Copy') => el('button', { class: 'small', type: 'button', text: label, onclick: async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(text); b.textContent = 'Copied ✓'; setTimeout(() => { b.textContent = label; }, 1500); } catch { banner('Clipboard unavailable; select the text and copy it manually.'); }
  } });
  function table(headers, rows, emptyText) {
    if (!rows.length) return el('div', { class: 'empty' }, [].concat(emptyText));
    return el('div', { class: 'table-wrap' }, el('table', {}, [
      el('thead', {}, el('tr', {}, headers.map((h) => el('th', { class: h.num ? 'num' : h.right ? 'right' : '', text: h.text ?? h })))),
      el('tbody', {}, rows),
    ]));
  }
  const card = (title, sub, body, { desc, ...attrs } = {}) => el('section', { class: 'card', ...attrs }, [
    el('div', { class: 'card-head' }, [el('h2', { text: title }), sub ? el('span', { class: 'sub' }, sub) : null, desc ? el('p', { class: 'sub desc', text: desc }) : null]),
    ...[].concat(body),
  ]);
  const pageHead = (title, sub, actions) => el('div', { class: 'page-head' }, [
    el('div', {}, [el('h1', { text: title }), sub ? el('div', { class: 'sub' }, sub) : null]),
    actions ? el('div', { class: 'actions' }, actions) : null,
  ]);
  const slugify = (s) => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+/, '').slice(0, 41).replace(/-+$/, '');

  // ---- views ----
  const view = $('#view');
  const render = (...nodes) => { clear(view); view.append(...nodes.filter(Boolean)); };
  const setTitle = (t) => { document.title = `${t} · Pigeon admin`; };

  async function projectsView() {
    setTitle('Projects');
    render(loadingCard());
    const { data } = await get('/admin/projects');

    // -- new project: name first, slug follows it until edited by hand
    const nameI = el('input', { type: 'text', required: true, maxlength: 200, placeholder: 'Billing app', autocomplete: 'off' });
    const slugI = el('input', { type: 'text', required: true, pattern: '[a-z0-9][a-z0-9\\-]{1,40}', placeholder: 'billing-app', title: '2–41 lowercase letters, digits and dashes', spellcheck: 'false', autocomplete: 'off' });
    let slugTouched = false;
    nameI.addEventListener('input', () => { if (!slugTouched) slugI.value = slugify(nameI.value); });
    slugI.addEventListener('input', () => { slugTouched = slugI.value !== ''; });
    const form = el('form', { class: 'row', onsubmit: (e) => {
      e.preventDefault();
      const slug = slugI.value.trim(), name = nameI.value.trim();
      act($('button[type=submit]', form), async () => {
        await api('POST', '/admin/projects', { slug, name });
        flash = { msg: `Created ${name}. Next: add the domain it will send from.`, ok: true };
        location.hash = `#/projects/${enc(slug)}`;
      });
    } }, [
      field('Project name', nameI),
      field('Slug', slugI, 'Used in URLs. Lowercase letters, digits and dashes.'),
      el('label', { class: 'field narrow' }, [el('span', { 'aria-hidden': 'true', text: ' ' }), el('span', { class: 'actions' }, [
        el('button', { class: 'primary', type: 'submit', text: 'Create project' }),
        data.length ? el('button', { type: 'button', class: 'ghost', text: 'Cancel', onclick: () => { newCard.hidden = true; form.reset(); slugTouched = false; } }) : null,
      ]), el('span', { class: 'hint', 'aria-hidden': 'true', text: ' ' })]),
    ]);
    const newCard = card('New project', null, form, { desc: 'Creates the project and its SES configuration set. You will add a sending domain and an API key next.', hidden: data.length > 0 });

    const rows = data.map((p) => {
      const href = `#/projects/${enc(p.slug)}`;
      return el('tr', { class: 'clickable', onclick: (e) => { if (!e.target.closest('a')) location.hash = href; } }, [
        el('td', {}, [el('a', { href, class: 'primary-text', text: p.name || p.slug }), el('div', { class: 'mono muted', text: p.slug })]),
        el('td', {}, p.domains.length ? el('span', { class: 'chips' }, p.domains.map((d) => chip(d))) : chip('needs a domain', 'warn')),
        el('td', { class: 'muted', text: fmt(p.created_at) }),
      ]);
    });
    render(
      pageHead('Projects', 'Each app that sends email is a project, with its own sending domains, API keys and email log.',
        [el('button', { class: 'primary', text: '+ New project', onclick: () => { newCard.hidden = false; nameI.focus(); } })]),
      newCard,
      card('All projects', plural(data.length, 'project'), table(['Project', 'Sending domains', 'Created'], rows,
        [el('strong', { text: 'No projects yet' }), 'Create one above to get an API key for your app.'])),
    );
    if (!data.length) nameI.focus();
  }

  async function projectView(slug) {
    render(loadingCard());
    const p = await get(`/admin/projects/${enc(slug)}`);
    setTitle(p.name);
    const reload = () => projectView(slug);
    const domainBase = `/admin/projects/${enc(slug)}/domains`;
    const keyBase = `/admin/projects/${enc(slug)}/keys`;

    // ---- domains
    /** Swaps a domain's header for an inline form: fix the name and/or move it to another project. */
    async function editDomain(domain, slot) {
      const { data: projects } = await get('/admin/projects');
      const nameI = el('input', { type: 'text', value: domain, required: true, pattern: '[A-Za-z0-9.\\-]+\\.[A-Za-z0-9\\-]+', spellcheck: 'false' });
      const projSel = el('select', {}, projects.map((x) => el('option', { value: x.slug, text: x.name ? `${x.name} (${x.slug})` : x.slug, selected: x.slug === p.slug })));
      const dropOld = el('input', { type: 'checkbox' });
      const dropWrap = el('label', { class: 'check', hidden: true }, [dropOld, ` Also delete the SES identity for ${domain}`]);
      const renameNote = el('p', { class: 'sub', hidden: true, text: 'A new name must be verified again: you will get fresh DNS records to add.' });
      nameI.addEventListener('input', () => { const same = nameI.value.trim().toLowerCase() === domain; dropWrap.hidden = same; renameNote.hidden = same; });
      const form = el('form', { class: 'row', onsubmit: (e) => {
        e.preventDefault();
        const body = {}, nd = nameI.value.trim().toLowerCase();
        if (nd !== domain) body.domain = nd;
        if (projSel.value !== p.slug) body.project = projSel.value;
        if (!Object.keys(body).length) { banner('Nothing to save: the domain and project are unchanged.'); return; }
        act($('button[type=submit]', form), async () => {
          const q = body.domain && dropOld.checked ? '?delete_identity=true' : '';
          const r = await api('PATCH', `${domainBase}/${enc(domain)}${q}`, body);
          const did = [body.domain ? `renamed to ${r.domain}` : null, body.project ? `moved to ${r.project}` : null].filter(Boolean).join(' and ');
          const next = body.domain && !body.project ? ' Add its DNS records, then re-check.' : '';
          flash = r.warnings.length ? { msg: `${domain} ${did}. ${r.warnings.join(' ')}`, ok: false } : { msg: `${domain} ${did}.${next}`, ok: true };
          await route();
        });
      } }, [
        field('Domain', nameI),
        field('Project', projSel),
        el('label', { class: 'field narrow' }, [el('span', { 'aria-hidden': 'true', text: ' ' }), el('span', { class: 'actions' }, [
          el('button', { class: 'primary', type: 'submit', text: 'Save' }),
          el('button', { type: 'button', text: 'Cancel', onclick: reload }),
        ])]),
      ]);
      clear(slot).append(el('div', { style: 'flex:1 1 100%' }, [form, renameNote, dropWrap]));
      nameI.focus();
    }
    const domainRows = await Promise.all(p.domains.map(async (d) => {
      let identity = null, err = null;
      try { identity = await get(`${domainBase}/${enc(d)}`); } catch (e) { err = e; }
      return { domain: d, identity, err };
    }));
    function domainBlock({ domain, identity, err }) {
      const status = err ? chip(`SES error: ${err.message}`, 'bad')
        : identity.verified ? chip('verified · ready to send', 'dot good') : chip(`waiting for DNS (DKIM ${identity.dkimStatus})`, 'dot warn');
      const dns = identity?.dnsRecords?.length
        ? el('details', { open: !identity.verified }, [
            el('summary', { text: identity.verified ? `DNS records (${identity.dnsRecords.length})` : `Add these ${identity.dnsRecords.length} DNS records to verify it` }),
            el('div', { class: 'notice info' }, [
              'Add these at the DNS provider for ', el('code', { text: domain }), '. Enter the ', el('strong', { text: 'Host' }),
              ' exactly as shown: Namecheap, GoDaddy, Cloudflare and most registrars append the domain themselves, so typing the full name creates ',
              el('code', { text: `…${domain}.${domain}` }), ' and verification never completes. For MX, enter the value without the leading priority number and put 10 in the priority field. DNS changes can take a few minutes to an hour; then click Re-check.',
            ]),
            table(['Type', 'Host', 'Value', 'Purpose'], identity.dnsRecords.map((r) => el('tr', {}, [
              el('td', {}, el('strong', { text: r.type })),
              el('td', { class: 'wrap' }, [el('div', { class: 'actions' }, [el('code', { text: r.host ?? r.name }), copyButton(r.host ?? r.name)]), el('div', { class: 'muted', style: 'font-size:11.5px;margin-top:2px' }, [`full name: ${r.name}`])]),
              el('td', { class: 'wrap' }, el('div', { class: 'actions' }, [el('code', { text: r.value }), copyButton(r.value)])),
              el('td', { class: 'sub', text: r.purpose }),
            ])), ''),
          ])
        : null;
      const mailFrom = identity?.mailFromStatus ? el('div', { class: 'sub', style: 'margin-top:6px' }, [`Custom MAIL FROM: ${identity.mailFromStatus}`]) : null;

      // One "Delete…" button; the panel says what happens and offers the SES identity option.
      const alsoIdentity = el('input', { type: 'checkbox' });
      const delPanel = el('div', { class: 'confirm-panel', hidden: true }, [
        el('p', {}, [el('strong', { text: `Delete ${domain} from ${p.name}?` }), ' The project stops sending from it immediately.']),
        el('label', { class: 'check' }, [alsoIdentity, el('span', {}, ['Also delete its SES identity. ', el('span', { class: 'muted', text: 'Skip this if the domain will be attached to another project: re-adding it means verifying its DNS again.' })])]),
        el('div', { class: 'actions' }, [
          el('button', { class: 'small danger solid', text: 'Delete domain', onclick: (e) => act(e.currentTarget, async () => {
            await api('DELETE', `${domainBase}/${enc(domain)}${alsoIdentity.checked ? '?delete_identity=true' : ''}`); await reload();
          }, `Deleted ${domain}${alsoIdentity.checked ? ' and its SES identity' : ''}.`) }),
          el('button', { class: 'small', text: 'Cancel', onclick: () => { delPanel.hidden = true; } }),
        ]),
      ]);
      const head = el('div', { class: 'domain-head' }, [
        el('span', { class: 'name', text: domain }), status, el('span', { class: 'spacer' }),
        el('button', { class: 'small', text: 'Re-check', onclick: (e) => act(e.currentTarget, reload) }),
        el('button', { class: 'small', text: 'Edit', onclick: (e) => act(e.currentTarget, () => editDomain(domain, head)) }),
        el('button', { class: 'small danger', text: 'Delete…', onclick: () => { delPanel.hidden = !delPanel.hidden; } }),
      ]);
      return el('div', { class: 'domain' }, [head, delPanel, mailFrom, dns]);
    }
    const domainInput = el('input', { type: 'text', placeholder: 'mail.example.com', required: true, pattern: '[A-Za-z0-9.\\-]+\\.[A-Za-z0-9\\-]+', spellcheck: 'false', autocomplete: 'off' });
    const domainForm = el('form', { class: 'row', onsubmit: (e) => {
      e.preventDefault();
      const domain = domainInput.value.trim().toLowerCase();
      act($('button', domainForm), async () => { await api('POST', domainBase, { domain }); await reload(); }, `Added ${domain}. Add the DNS records shown, then re-check.`);
    } }, [
      field(p.domains.length ? 'Add another domain' : 'Add a sending domain', domainInput, 'The domain in your From address, e.g. example.com or mail.example.com.'),
      el('label', { class: 'field narrow' }, [el('span', { 'aria-hidden': 'true', text: ' ' }), el('button', { class: p.domains.length ? '' : 'primary', type: 'submit', text: 'Add domain' }), el('span', { class: 'hint', 'aria-hidden': 'true', text: ' ' })]),
    ]);
    const domainsCard = card('Sending domains', p.domains.length ? plural(p.domains.length, 'domain') : null, [
      ...(domainRows.length ? domainRows.map(domainBlock) : [el('div', { class: 'empty' }, [el('strong', { text: 'No domains yet' }), 'The project cannot send until one is added and verified.'])]),
      el('div', { class: 'card-foot' }, domainForm),
    ], { desc: 'Emails can only be sent from addresses on these domains, once their DNS is verified.', id: 'domains' });

    // ---- API keys
    let keyTable = el('div');
    const renderKeys = () => {
      const tbl = table(['Name', 'Key', 'Created', 'Last used', 'Status', { text: '', right: true }], p.api_keys.map(keyRow),
        [el('strong', { text: 'No API keys yet' }), 'Issue one below and give it to the app that sends email.']);
      keyTable.replaceWith(tbl); keyTable = tbl;
      renderSteps();
    };
    const refreshKeys = async () => { p.api_keys = (await get(`/admin/projects/${enc(slug)}`)).api_keys; renderKeys(); };
    function keyRow(k) {
      const nameCell = el('td', {}, el('span', { class: 'primary-text', text: k.name }));
      const rename = () => {
        const input = el('input', { type: 'text', value: k.name, required: true, maxlength: 100, 'aria-label': 'Key name' });
        const form = el('form', { class: 'actions', onsubmit: (e) => {
          e.preventDefault();
          act($('button', form), async () => { await api('PATCH', `${keyBase}/${k.id}`, { name: input.value.trim() }); await refreshKeys(); }, 'Key renamed.');
        } }, [input, el('button', { class: 'small primary', type: 'submit', text: 'Save' }), el('button', { class: 'small', type: 'button', text: 'Cancel', onclick: renderKeys })]);
        clear(nameCell).append(form); input.focus(); input.select();
      };
      return el('tr', {}, [
        nameCell, el('td', {}, el('code', { text: `${k.prefix}…` })),
        el('td', { class: 'muted', text: fmt(k.created_at) }), el('td', { class: k.last_used_at ? '' : 'muted', text: ago(k.last_used_at) }),
        el('td', {}, k.revoked_at ? chip(`revoked ${fmt(k.revoked_at)}`, 'bad') : chip('active', 'dot good')),
        el('td', { class: 'right' }, el('span', { class: 'actions' }, [
          el('button', { class: 'small ghost', text: 'Rename', onclick: rename }),
          k.revoked_at ? null : confirmButton('Revoke', async () => { await api('DELETE', `${keyBase}/${k.id}`); await refreshKeys(); }, 'danger', 'Revoke: apps using it stop', `Revoked "${k.name}".`),
          confirmButton('Delete', async () => { await api('DELETE', `${keyBase}/${k.id}?permanent=true`); await refreshKeys(); }, 'danger',
            k.revoked_at ? 'Delete for good' : 'Delete: apps using it stop', `Deleted "${k.name}".`),
        ])),
      ]);
    }
    const sendExample = (key) => {
      const from = p.domains[0] ? `no-reply@${p.domains[0]}` : 'no-reply@your-domain.com';
      return `curl ${location.origin}/v1/emails \\\n  -H "Authorization: Bearer ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "from": "${from}",\n    "to": ["you@example.com"],\n    "subject": "Hello from Pigeon",\n    "text": "It works!"\n  }'`;
    };
    const newKey = el('div');
    const keyInput = el('input', { type: 'text', placeholder: 'production', required: true, maxlength: 100, autocomplete: 'off' });
    const keyForm = el('form', { class: 'row', onsubmit: (e) => {
      e.preventDefault();
      const name = keyInput.value.trim();
      act($('button', keyForm), async () => {
        const k = await api('POST', keyBase, { name });
        const example = sendExample(k.key);
        clear(newKey).append(el('div', { class: 'notice success' }, [
          el('div', {}, [el('strong', { text: `Key "${k.name}" created. ` }), 'Copy it now: it is shown only once and never stored in plaintext.']),
          el('div', { class: 'secret' }, [el('code', { text: k.key }), copyButton(k.key, 'Copy key')]),
          el('details', { style: 'margin-top:10px' }, [
            el('summary', { text: 'Try it: send a test email from your terminal' }),
            el('div', { class: 'code-block' }, [el('pre', { text: example }), copyButton(example)]),
            el('div', { class: 'sub' }, ['Change the To address to yours. ', p.domains.length ? null : 'Add and verify a sending domain first. ', el('a', { href: '/docs', text: 'Developer guide →' })]),
          ]),
        ]));
        keyForm.reset();
        await refreshKeys(); // keeps the one-time key box
      });
    } }, [
      field('Name for a new key', keyInput, 'Where it will be used, e.g. production or staging.'),

      const tabs = el('div', { class: 'tabs-row', role: 'tablist' }, [['preview', 'Preview'], ['text', 'Text'], ['source', 'HTML source'], ['details', 'Details'], ['events', `Events (${m.events.length})`]].map(([k, label]) =>
        el('button', { type: 'button', role: 'tab', 'aria-selected': String(k === 'preview'), text: label, onclick: (e) => {
          tabs.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', String(b === e.currentTarget)));
          clear(paneHost).append(...[].concat(panes[k]()).filter(Boolean));
        } })));
      clear(paneHost).append(...[].concat(panes.preview()).filter(Boolean));

      clear(detail).append(card(m.subject || '(no subject)', closeBtn, [
        el('div', { class: 'sub actions' }, [statusChip(m.status), el('span', { class: 'wrap', text: `${m.from} → ${m.to.join(', ') || '(no recipients)'}` })]),
        el('div', { class: 'muted', style: 'font-size:12.5px;margin-top:4px', text: `${fmtFull(m.created_at)} · ${m.project}` }),
        m.last_error ? el('div', { class: 'notice danger', text: m.last_error }) : null,
        attachments, tabs, paneHost,
      ]));
      if (window.innerWidth < 1100) detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    const changed = () => { syncUrl(); load(); };
    const resetFilters = () => { history.replaceState(null, '', '#/emails'); emailsView(new URLSearchParams()); };
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-range]'); if (!b) return;
      st.range = b.dataset.range;
      seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      if (st.range === 'custom') {
        if (!st.from && !st.to) { const [s, u] = rangeWindow({ range: '7d' }); st.from = ymd(s); st.to = ymd(addDays(u, -1)); fromI.value = st.from; toI.value = st.to; }
      } else { st.from = ''; st.to = ''; }
      applyDateLimits(); changed();
    });
    for (const i of [fromI, toI]) i.addEventListener('change', () => {
      st.from = fromI.value; st.to = toI.value;
      if (st.from && st.to && st.from > st.to) { banner('The start date is after the end date.'); return; }
      banner(null); changed();
    });
    projectSel.addEventListener('change', () => { st.project = projectSel.value; st.domain = ''; fillDomains(); changed(); });
    domainSel.addEventListener('change', () => { st.domain = domainSel.value; changed(); });
    statusSel.addEventListener('change', () => { st.status = statusSel.value; changed(); });
    let typing;
    for (const [i, k] of [[recipientI, 'recipient'], [subjectI, 'subject']]) {
      i.addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(() => { st[k] = i.value.trim(); changed(); }, 300); });
    }

    render(
      pageHead('Email log', 'Every email from every project. Click one to see it as the recipient does. The address bar keeps your filters, so you can share a view.'),
      el('section', { class: 'card' }, [
        el('div', { class: 'actions' }, [seg, custom]),
        el('div', { class: 'filters' }, [projectSel, domainSel, statusSel, recipientI, subjectI,
          el('button', { class: 'small ghost', text: 'Reset', onclick: resetFilters }),
          el('button', { class: 'small', text: 'Refresh', onclick: (e) => act(e.currentTarget, () => load()) })]),
      ]),
      grid,
    );
    applyDateLimits();
    await load();
    if (st.id) openEmail(st.id);
  }

  async function suppressionsView() {
    setTitle('Suppressions');
    render(loadingCard());
    const { data: projects } = await get('/admin/projects');
    const projectName = new Map(projects.map((p) => [p.id, p.slug]));
    const reasonChip = (r) => chip(r, r === 'manual' ? '' : 'bad');
    const removeBtn = (email, after) => confirmButton('Remove', async () => { await api('DELETE', `/admin/suppressions/${enc(email)}`); await after(); }, 'danger', 'Remove: allow sending again', `${email} can receive email again.`);
    const list = el('div');
    async function load(before) {
      const q = new URLSearchParams({ limit: '100' }); if (before) q.set('before', before);
      const { data, next_before } = await get(`/admin/suppressions?${q}`);
      const rows = data.map((s) => el('tr', {}, [
        el('td', { class: 'wrap' }, el('code', { text: s.email })),
        el('td', {}, reasonChip(s.reason)),
        el('td', { text: s.project_id ? (projectName.get(s.project_id) ?? s.project_id) : 'admin' }),
        el('td', { class: 'sub wrap', text: s.note || '' }), el('td', { class: 'muted', text: fmt(s.created_at) }),
        el('td', { class: 'right' }, removeBtn(s.email, () => load())),
      ]));
      clear(list).append(table(['Email', 'Reason', 'Added by', 'Note', 'When', { text: '', right: true }], rows,
        [el('strong', { text: 'The suppression list is empty' }), 'Addresses that bounce or complain are added here automatically.']));
      if (next_before) list.append(el('div', { class: 'actions', style: 'margin-top:10px' }, el('button', { class: 'small', text: 'Older…', onclick: (e) => act(e.currentTarget, () => load(next_before)) })));
    }
    const lookup = el('div');
    const lookupI = el('input', { type: 'email', placeholder: 'someone@example.com', required: true, autocomplete: 'off' });
    const lookupForm = el('form', { class: 'row', onsubmit: (e) => {
      e.preventDefault();
      const email = lookupI.value.trim();
      act($('button', lookupForm), async () => {
        try {
          const s = await get(`/admin/suppressions/${enc(email)}`);
          clear(lookup).append(el('div', { class: 'notice warn' }, [
            el('div', {}, [el('strong', { text: s.email }), ' is suppressed: no project can send to it. ', reasonChip(s.reason)]),
            el('div', { class: 'sub', style: 'margin:4px 0 8px' }, `${s.note ? `${s.note} · ` : ''}added ${fmt(s.created_at)}`),
            removeBtn(s.email, async () => { clear(lookup); await load(); }),
          ]));
        } catch (err) {
          if (err.status === 404) clear(lookup).append(el('div', { class: 'notice success' }, [el('strong', { text: email }), ' is not suppressed. Emails to it are sent normally.'])); else throw err;
        }
      });
    } }, [field('Email address', lookupI), el('label', { class: 'field narrow' }, [el('span', { 'aria-hidden': 'true', text: ' ' }), el('button', { type: 'submit', text: 'Check' })])]);
    const addEmail = el('input', { type: 'email', placeholder: 'someone@example.com', required: true, autocomplete: 'off' });
    const addNote = el('input', { type: 'text', placeholder: 'e.g. asked to stop receiving email', maxlength: 500 });
    const addForm = el('form', { class: 'row', onsubmit: (e) => {
      e.preventDefault();
      act($('button', addForm), async () => { await api('POST', '/admin/suppressions', { email: addEmail.value.trim(), note: addNote.value.trim() || undefined }); addForm.reset(); await load(); }, 'Suppressed. No project can send to it now.');
    } }, [field('Email address', addEmail), field('Note (optional)', addNote), el('label', { class: 'field narrow' }, [el('span', { 'aria-hidden': 'true', text: ' ' }), el('button', { class: 'primary', type: 'submit', text: 'Suppress' })])]);
    render(
      pageHead('Suppressions', 'Addresses no project will send to. Bounces and spam complaints land here automatically, so one project\'s bad addresses never hurt the others\' reputation.'),
      el('div', { class: 'grid-2' }, [
        card('Check an address', null, [lookupForm, lookup], { desc: 'Find out why someone is not getting email.' }),
        card('Block an address', null, addForm, { desc: 'Admin entries belong to no project, so only an admin can remove them.' }),
      ]),
      card('Suppression list', null, list, { desc: 'Shared by every project. Removing a bounce or complaint entry lets all projects send to that address again.' }),
    );
    await load();
  }

  // ---- router ----
  /** A message to show once the next view has rendered (route() clears the toasts). */
  let flash = null;
  async function route() {
    const h = location.hash || '#/projects';
    const m = h.match(/^#\/projects\/([^/]+)$/);
    const current = h.startsWith('#/suppressions') ? 'suppressions' : h.startsWith('#/emails') ? 'emails' : 'projects';
    document.body.classList.remove('wide');
    document.querySelectorAll('#nav a[data-route]').forEach((a) => { if (a.dataset.route === current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    banner(null);
    try {
      if (m) await projectView(decodeURIComponent(m[1]));
      else if (current === 'suppressions') await suppressionsView();
      else if (current === 'emails') await emailsView(new URLSearchParams(h.split('?')[1] || ''));
      else await projectsView();
      if (flash) { banner(flash.msg, flash.ok); flash = null; }
    } catch (err) {
      if (err.status !== 401) render(el('div', { class: 'card' }, [
        el('h2', { text: err.status === 404 ? 'Not found' : 'Could not load this page' }), el('p', { class: 'sub', text: describe(err) }),
        el('div', { class: 'actions' }, [el('button', { class: 'small', text: 'Try again', onclick: route }), el('a', { href: '#/projects', class: 'sub', text: 'Back to projects' })]),
      ]));
    }
  }
  window.addEventListener('hashchange', route);
  $('#signout').addEventListener('click', async () => {
    await fetch('/admin/auth/logout', { method: 'POST', headers: UI_HEADERS }).catch(() => {});
    location.replace('/admin/login');
  });
  get('/admin/auth/me').then((me) => { $('#who').textContent = me.username ? `Signed in as ${me.username}` : ''; }).catch(() => {});
  route();
})();
</script>
</body>
</html>
